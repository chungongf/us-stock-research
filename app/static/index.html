<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Stock Research</title>
<style>
  :root { --bg:#1a2a3f; --panel:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
          --accent:linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%); --good:#10b981; --bad:#ef4444; --code:#f8fafc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a2a3f; --panel:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --line:#334155;
            --accent:linear-gradient(135deg, #60a5fa 0%, #22d3ee 100%); --good:#34d399; --bad:#f87171; --code:#0f172a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); background-attachment:fixed; color:var(--text); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:28px; margin:0 0 8px; font-weight:800; background:linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
       -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .sub { color:#cbd5e1; margin:0 0 20px; font-size:13px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; margin-bottom:20px;
           box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, textarea { width:100%; padding:10px 12px; border:2px solid #cbd5e1; border-radius:8px;
                    background:#ffffff; color:#0f172a; font:inherit; font-size:14px; }
  input::placeholder, textarea::placeholder { color:#94a3b8; }
  input:focus, textarea:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,0.25); }
  textarea { min-height:60px; resize:vertical; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:0 12px; }
  button { margin-top:14px; padding:12px 24px; border:0; border-radius:8px; background:var(--accent);
           color:#fff; font:inherit; font-weight:700; cursor:pointer; transition:transform 0.2s, box-shadow 0.2s;
           box-shadow:0 4px 15px rgba(59, 130, 246, 0.4); }
  button:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 6px 20px rgba(59, 130, 246, 0.6); }
  button:disabled { opacity:.5; cursor:default; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  pre { background:var(--code); padding:10px; border-radius:6px; white-space:pre-wrap; word-break:break-word;
        font-size:12.5px; max-height:420px; overflow:auto; margin:6px 0 0; }
  .verdict { font-weight:700; }
  .INVEST { color:var(--good); } .PASS { color:var(--bad); }
  details { border-top:1px solid var(--line); padding:8px 0; }
  summary { cursor:pointer; }
  ul { margin:4px 0 8px 18px; padding:0; }
  a { color:#2563eb; }
  .warn { color:var(--bad); font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>US Stock Research</h1>
  <p class="sub">Finviz screen → fundamentals, news, 10-K and earnings release → 4 AI analysts → invest / pass. <span id="llm"></span></p>
  <p id="secwarn" class="warn" hidden>SEC_USER_AGENT is not set, so 10-K and earnings-release data will be skipped.</p>

  <form class="panel" id="form">
    <label for="filters">Finviz filters (the <code>f=</code> value from a finviz.com screener URL)</label>
    <input id="filters" name="filters">
    <label for="tickers">Or evaluate these tickers instead (comma-separated; skips the screen)</label>
    <input id="tickers" name="tickers" placeholder="e.g. MSFT, NVDA, COST">
    <label for="userCriteria">Your criteria (free text, optional)</label>
    <textarea id="userCriteria" name="userCriteria" placeholder="e.g. management must be clean; no heavy insider selling; policy must not be a headwind"></textarea>
    <div class="grid">
      <div><label for="order">Sort (Finviz o=)</label><input id="order" name="order"></div>
      <div><label for="maxStocksToEvaluate">Max stocks</label><input id="maxStocksToEvaluate" name="maxStocksToEvaluate" type="number" min="1" max="50"></div>
      <div><label for="horizonYears">Horizon (years)</label><input id="horizonYears" name="horizonYears" type="number" min="1" max="10"></div>
      <div><label for="minConviction">Min conviction</label><input id="minConviction" name="minConviction" type="number" min="1" max="10"></div>
      <div><label for="maxDocChars">Max doc chars</label><input id="maxDocChars" name="maxDocChars" type="number" min="2000" step="1000"></div>
    </div>
    <p class="hint">Each stock costs 4 LLM calls. Stops at the first stock rated INVEST.</p>
    <button id="run" type="submit">Run research</button>
  </form>

  <section class="panel" id="statusPanel" hidden>
    <div><strong>Status:</strong> <span id="status"></span></div>
    <pre id="log"></pre>
  </section>

  <section class="panel" id="resultPanel" hidden></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list = xs => Array.isArray(xs) && xs.length ? '<ul>' + xs.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>' : '<p class="hint">none</p>';
const NUM = ['maxStocksToEvaluate','horizonYears','minConviction','maxDocChars'];
const FIELDS = ['filters','tickers','userCriteria','order', ...NUM];

fetch('api/defaults').then(r => r.json()).then(d => {
  FIELDS.forEach(f => { if (d[f] !== undefined) $(f).value = d[f]; });
  $('llm').textContent = 'Model: ' + d.llm;
  $('secwarn').hidden = d.secConfigured;
});

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {};
  FIELDS.forEach(f => body[f] = NUM.includes(f) ? Number($(f).value) : $(f).value);
  $('run').disabled = true;
  $('resultPanel').hidden = true;
  $('statusPanel').hidden = false;
  $('status').textContent = 'queued'; $('log').textContent = '';
  const { id } = await (await fetch('api/run', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })).json();
  poll(id);
});

async function poll(id) {
  const r = await fetch('api/jobs/' + id);
  if (!r.ok) { $('status').textContent = 'lost (server restarted?)'; $('run').disabled = false; return; }
  const j = await r.json();
  $('status').textContent = j.status;
  $('log').textContent = j.log.join('\n');
  $('log').scrollTop = $('log').scrollHeight;
  if (j.status === 'done') { render(j.result); $('run').disabled = false; }
  else if (j.status === 'error') { $('run').disabled = false; }
  else setTimeout(() => poll(id), 3000);
}

function render(res) {
  const p = $('resultPanel'); p.hidden = false;
  let h = '';
  if (res.result === 'INVEST') {
    h += `<h2 class="verdict INVEST">INVEST: ${esc(res.stock)} (${esc(res.symbol)}), conviction ${res.conviction}/10</h2>
      <p>${esc(res.why)}</p><strong>Thesis</strong>${list(res.thesis)}<strong>Catalysts</strong>${list(res.catalysts)}
      <strong>Risks</strong>${list(res.risks)}<strong>Valuation</strong><p>${esc(res.valuation_view)}</p>`;
    if (res.criteria_check?.length) h += '<strong>Criteria check</strong><ul>' + res.criteria_check.map(c =>
      `<li>${c.met === true ? '✅' : c.met === false ? '❌' : '❔'} ${esc(c.criterion)}: ${esc(c.evidence)}</li>`).join('') + '</ul>';
  } else {
    h += `<h2 class="verdict PASS">No qualifying stock</h2><p>${esc(res.message)}</p>`;
  }
  h += '<h3>Evaluated</h3>';
  for (const e of res.evaluated || []) {
    const src = Object.entries(e.sources || {}).filter(([,u]) => u).map(([k,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${k}</a>`).join(' · ');
    h += `<details><summary><span class="verdict ${e.verdict}">${e.verdict}</span> ${esc(e.symbol)}: ${esc(e.stock)} (conviction ${e.conviction})</summary>
      <p>${esc(e.reason)}</p><p class="hint">${src}</p>
      <details><summary>Fundamental analyst</summary><pre>${esc(e.reports.fundamentals)}</pre></details>
      <details><summary>News & sentiment analyst</summary><pre>${esc(e.reports.news)}</pre></details>
      <details><summary>10-K & management analyst</summary><pre>${esc(e.reports.filings)}</pre></details>
      <details><summary>Committee JSON</summary><pre>${esc(JSON.stringify(e.details, null, 2))}</pre></details>
    </details>`;
  }
  h += `<p class="hint">${esc(res.disclaimer)}</p>`;
  p.innerHTML = h;
}
</script>
</body>
</html>
